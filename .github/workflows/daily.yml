name: daily

on:
  schedule:
    # 23:30 UTC = 次日 07:30 CST；GitHub 的 cron 只认 UTC
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略交易日闸门，强制跑一次
        type: boolean
        default: false
      smoke_only:
        description: 只跑数据源连通性冒烟
        type: boolean
        default: false
      bootstrap:
        description: 没有状态包时允许空库起跑
        type: boolean
        default: false

concurrency:
  group: fundana-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: github-pages
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 检查磁盘
        run: |
          set -euo pipefail
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "根分区可用 $avail GB"
          if [ "$avail" -lt 25 ]; then
            echo "::warning::磁盘不足 25GB，清理预装工具链"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune -af >/dev/null 2>&1 || true
            df -h /
          fi

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: 安装依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt
          python -c "import yaml, requests, markdown; print('deps ok')"

      - name: 数据源冒烟
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_only == true
        run: python scripts/smoke_sources.py

      - name: 交易日闸门
        id: gate
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_only != true
        run: |
          set -uo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制模式：跳过交易日闸门"
            echo "run=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python scripts/trading_day.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
          echo "闸门退出码 $rc"

      - name: 拉取状态包
        id: state
        if: steps.gate.outputs.run == 'yes'
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/state"
          mkdir -p "$state_dir"
          have=no
          if gh release view state >/dev/null 2>&1; then
            gh release download state --pattern manifest.json --dir "$state_dir" --clobber
            jq -r '.parts[].name' "$state_dir/manifest.json" | while read -r name; do
              echo "下载分片 $name"
              gh release download state --pattern "$name" --dir "$state_dir" --clobber
            done
            have=yes
            du -sh "$state_dir"
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::没有状态包，bootstrap 模式空库起跑"
          else
            echo "::error::没有状态包，且未开启 bootstrap"
            exit 1
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"

      - name: 恢复状态
        if: steps.gate.outputs.run == 'yes' && steps.state.outputs.have == 'yes'
        run: python scripts/state_bundle.py import --root . --src "$RUNNER_TEMP/state"

      - name: 跑每日流水线
        id: daily
        if: steps.gate.outputs.run == 'yes'
        run: |
          set -o pipefail
          extra=""
          if [ "${{ inputs.force }}" = "true" ]; then extra="--force"; fi
          python -m fundana daily --quiet $extra | tee run.json

      - name: 校验发布
        if: steps.daily.outcome == 'success'
        run: python -m fundana verify --fast

      - name: 打包状态
        id: export
        if: always() && steps.gate.outputs.run == 'yes'
        run: python scripts/state_bundle.py export --root . --out "$RUNNER_TEMP/bundle" --slim

      - name: 上传状态包
        if: always() && steps.export.outcome == 'success'
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          if ! gh release view state >/dev/null 2>&1; then
            gh release create state --title "fundana state" --latest=false --notes "滚动状态包：每日覆盖。manifest.json 最后上传，指向当前有效分片。"
          fi
          for f in "$bundle"/state-*.part.*; do
            echo "上传 $f"
            gh release upload state "$f" --clobber
          done
          # manifest 最后上传：中途失败时旧指针仍指向完整的一套分片
          gh release upload state "$bundle/manifest.json" --clobber
          keep=$(jq -r '.parts[].name' "$bundle/manifest.json" | paste -sd ' ' -)
          gh release view state --json assets -q '.assets[].name' | while read -r name; do
            case " $keep manifest.json " in
              *" $name "*) ;;
              *)
                echo "删除旧资产 $name"
                gh release delete-asset state "$name" -y
                ;;
            esac
          done

      - name: 生成静态站
        if: steps.daily.outcome == 'success'
        run: python scripts/site_build.py --out site

      - name: 配置 Pages
        if: steps.daily.outcome == 'success'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 Pages
        if: steps.daily.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 Pages
        id: deploy
        if: steps.daily.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: 发布当期报告附件
        if: steps.daily.outcome == 'success'
        run: |
          set -euo pipefail
          state=reports/publication_state.json
          if [ ! -f "$state" ]; then
            echo "没有 publication_state.json，跳过"
            exit 0
          fi
          nav=$(jq -r '.nav_as_of // empty' "$state")
          rev=$(jq -r '.revision_path // empty' "$state")
          if [ -z "$nav" ] || [ -z "$rev" ]; then
            echo "状态文件缺字段，跳过"
            exit 0
          fi
          tag="report-$nav"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$rev"/*.csv --clobber
          else
            gh release create "$tag" "$rev"/*.csv --latest=false --title "基金筛选报告 $nav" --notes "由 GitHub Actions 自动生成；同一天多次运行会覆盖附件。"
          fi

      - name: 保活
        if: always() && steps.gate.outputs.run == 'yes'
        run: |
          nav=""
          if [ -f reports/publication_state.json ]; then
            nav=$(jq -r '.nav_as_of // empty' reports/publication_state.json)
          fi
          FUNDANA_STATUS="${{ steps.daily.outcome }}" FUNDANA_NAV_AS_OF="$nav" python scripts/keepalive.py

      - name: 写运行摘要
        if: always()
        run: |
          {
            echo "## fundana daily"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 交易日闸门 | ${{ steps.gate.outputs.run }} |"
            echo "| 状态包 | ${{ steps.state.outputs.have }} |"
            echo "| 主流程 | ${{ steps.daily.outcome }} |"
            echo "| 状态导出 | ${{ steps.export.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/publication_state.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 当前发布" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/    /' reports/publication_state.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 失败时开 issue
        if: failure()
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="运行记录：$url"
          existing=$(gh issue list --state open --search 'daily 失败 in:title' --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "daily 失败 $(date +%F)" --body "$body"
          fi

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-context
          if-no-files-found: ignore
          retention-days: 7
          path: |
            run.json
            reports/runs/**/diagnostics/**
